name: Kernel CI

# The private kernel's checks (SpindleLabs-app/kernel), run here because public
# repositories' runners are free and a private repo's minutes would last a
# few days (Ben's decision, 2026-10-27). The kernel repo's own ci.yml starts
# this for each pull request push and each push to its main, through
# workflow_dispatch; it never runs on anything in this repo.
#
# This log is public. So: the kernel's scripts print only RESULT lines
# (its ci/quiet.sh), every line also passes .github/scripts/kernel_ci.sh
# filter here, the full logs go only to the private kernel-results repo,
# nothing is cached (a pull request from a fork can read main's caches) and
# nothing is uploaded as an artifact (public too). The verdicts go back to the
# kernel commit as statuses kernel-ci/checks and kernel-ci/mutants, which the
# kernel repo's auto-merge waits for.
#
# Secrets, in the "kernel" environment, which only main may use (Ben adds
# them; every job that needs them names it, so no other branch's workflow
# and no fork can read them; test_kernel_ci.py checks): KERNEL_READ, a fine-grained key with
# read-only contents and read-write commit statuses on SpindleLabs-app/kernel;
# RESULTS_WRITE, contents and issues read-write on SpindleLabs-app/kernel-results.
# The title names the label, so the kernel repo's ci.yml can find and cancel
# a pull request's run when it goes back to draft.
run-name: Kernel CI ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Kernel commit to test (a pull request's merge commit, or main)"
        required: true
      head:
        description: "Kernel commit the statuses go on (the pull request's head; main: same as sha)"
        required: true
      base:
        description: "Kernel commit to count mutants from (empty: no mutation testing)"
        required: false
        default: ""
      label:
        description: "pr-<number>, train-<number> or main"
        required: true

# A newer push to the same pull request cancels the older run; main's finish.
concurrency:
  group: kernel-ci-${{ inputs.label }}
  cancel-in-progress: ${{ inputs.label != 'main' }}

# The jobs need no rights on this repo: they use the two keys above.
permissions: {}

env:
  SHA: ${{ inputs.sha }}
  HEAD_SHA: ${{ inputs.head }}
  BASE: ${{ inputs.base }}
  LABEL: ${{ inputs.label }}

jobs:
  # The kernel's checks run in parts at once, one runner each (the kernel's
  # ci/parts.sh names them): one after another they took 65 to 115 minutes
  # (2026-11-06), in parts about as long as the slowest part. A kernel commit
  # from before the parts runs them all in one part, "all".
  checks-plan:
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mark the kernel commit pending
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
        run: .github/scripts/kernel_ci.sh status kernel-ci/checks pending "Running on SpindleLabs' runners"
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - name: The parts
        id: plan
        run: |
          if [ -x k/ci/parts.sh ]; then
            parts=$(k/ci/parts.sh list 2>/dev/null | sed -n 's/^parts \(\[[a-z,]*\]\)$/\1/p')
          else
            parts='[all]'
          fi
          [ -n "$parts" ] || { echo "the parts list failed"; exit 1; }
          echo "parts $parts"
          echo "parts=$(echo "$parts" | sed 's/\([a-z][a-z]*\)/"\1"/g')" >>"$GITHUB_OUTPUT"

  checks:
    needs: checks-plan
    # Pinned to the image the oracles were pinned on: ubuntu-latest moved to a
    # newer one on 2026-11-11 (compiler defaulting to C23, PrusaSlicer 2.9.4
    # instead of the 2.7.2 the slicer oracle's settings are pinned to), which
    # broke the SolveSpace build and the slicer oracle on every part. Move it
    # on purpose, with the oracles re-pinned, never by drift.
    runs-on: ubuntu-24.04
    environment: kernel
    # The slowest part takes about 25 minutes; the whole checks once took 80
    # and one run on a slow runner was cancelled at 90 (2026-11-05). 150,
    # as for a mutants shard, so a kernel commit from before the parts still fits.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.checks-plan.outputs.parts) }}
    env:
      PART: ${{ matrix.part }}
    steps:
      - name: Inputs are commit ids, a label and a part, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ && $PART =~ ^[a-z]+$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/oracle-requirements.txt" >/dev/null 2>&1
      # SolveSpace, the sketch solver's outside judge: built from its pinned
      # source (30 to 50 seconds), with pinned build tools. Only the part whose
      # checks use it (solver: solver-solvespace; a kernel commit from before
      # the parts: all); a check that lacks it fails, never skips.
      - if: contains(fromJSON('["solver","all"]'), matrix.part)
        run: |
          # pip's own words go to the log when it fails (package names, files
          # and hashes of public packages only; the kernel is not in this step):
          # the step once failed on every part for days with nothing to read.
          log=$(mktemp)
          pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/solver-build-requirements.txt" >"$log" 2>&1 || { tail -n 25 "$log"; exit 1; }
          # -std=gnu17: the runners' compiler now defaults to C23, which removed
          # ATOMIC_VAR_INIT, and SolveSpace's bundled mimalloc still uses it
          # (the build failed on every part from 2026-11-11 about 01:40Z).
          CFLAGS="-std=gnu17" pip install -q --require-hashes --no-build-isolation -r "$GITHUB_WORKSPACE/.github/scripts/solver-requirements.txt" >"$log" 2>&1 || { tail -n 25 "$log"; exit 1; }
      # callgrind, for the kernel's speed baseline check; PrusaSlicer, the
      # slicing engine's oracle (Ubuntu noble ships 2.7.2).
      # Only the parts whose checks use them (baseline: release; the slicer
      # oracle: rest; a kernel commit from before the parts: all), so three
      # parts never touch the package mirror; a check that lacks its tool
      # fails, never skips. Usually 20 seconds, but a slow mirror once held it
      # 57 minutes and on 2026-11-06 failed three 5-minute tries in a row on
      # several parts at once: each download now gives up after 60 seconds
      # without data and is retried by apt itself, and a failed try waits
      # 1, 2, then 4 minutes before the next of four (up to 10 minutes each).
      - if: contains(fromJSON('["release","rest","all"]'), matrix.part)
        run: |
          # Ubuntu's mirrors stopped resolving on 2026-11-11: see the script.
          .github/scripts/apt-mirror.sh
          apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -qq)
          for try in 1 2 3 4; do
            sudo timeout 600 apt-get "${apt[@]}" update >/dev/null 2>&1 && sudo timeout 600 apt-get "${apt[@]}" install -y valgrind prusa-slicer >/dev/null 2>&1 && exit 0
            echo "apt-get try $try failed"
            [ $try = 4 ] || sleep $((60 * 2 ** (try - 1)))
          done
          exit 1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - name: The kernel's checks (one line each; logs in kernel-results)
        id: run
        env:
          # The oracle's report is read by this repo's file_issues.py.
          SPINDLELABS_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: |
          if [ "$PART" != all ]; then export CHECKS_PART=$PART; fi
          k/ci/checks.sh full "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/results.txt"
          grep -qx "RESULT all PASS [0-9]*" "$RUNNER_TEMP/results.txt"
      - name: Save the logs to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/results.txt" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          name=checks; [ "$PART" = all ] || name=checks-$PART
          .github/scripts/kernel_ci.sh save "$name" "$RUNNER_TEMP/logs"
      # A failing part reports at once, naming its failed checks; success
      # waits for every part (checks-report below).
      - name: Report a failure to the kernel commit
        if: always() && steps.run.outcome != 'success'
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          # skipped: a setup step failed, so no check ran.
          [ "$OUTCOME" = skipped ] && OUTCOME="setup failed, no check ran"
          .github/scripts/kernel_ci.sh status kernel-ci/checks failure "$PART: $(.github/scripts/kernel_ci.sh describe "$RUNNER_TEMP/results.txt" "$OUTCOME")"

  # kernel-ci/checks passes only when every part passed. A part that failed
  # has already reported; a plan or part that never got to report (cancelled,
  # timed out) is reported here.
  checks-report:
    needs: [checks-plan, checks]
    if: always()
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Report to the kernel commit
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          PLAN: ${{ needs.checks-plan.result }}
          PARTS: ${{ needs.checks.result }}
        run: |
          if [ "$PLAN" = success ] && [ "$PARTS" = success ]; then
            .github/scripts/kernel_ci.sh status kernel-ci/checks success "Every part passed"
          elif [ "$PARTS" != failure ]; then
            .github/scripts/kernel_ci.sh status kernel-ci/checks failure "plan $PLAN, parts $PARTS"
            exit 1
          else
            exit 1
          fi

  # Which kernel code no test runs at all (the kernel's ci/coverage.sh): a
  # per-file table and an lcov file, in kernel-results only. Report only: no
  # status, so it never holds a merge. Only for main's runs, after each merge
  # (Ben, 2026-10-29: about 790 runner minutes a day went on every pull
  # request push's copy).
  coverage:
    if: inputs.label == 'main'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Kernel test coverage (report in kernel-results)
        run: |
          [ -x k/ci/coverage.sh ] || { echo "this kernel commit has no ci/coverage.sh yet"; exit 0; }
          .github/scripts/kernel_ci.sh run coverage "$RUNNER_TEMP/logs" k/ci/coverage.sh "$RUNNER_TEMP/logs"
      - name: Save the report to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: mkdir -p "$RUNNER_TEMP/logs" && .github/scripts/kernel_ci.sh save coverage "$RUNNER_TEMP/logs"

  mutants-plan:
    if: inputs.base != ''
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mark the kernel commit pending
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
        run: .github/scripts/kernel_ci.sh status kernel-ci/mutants pending "Counting the mutants in the changed lines"
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Count the mutants in the changed kernel code
        id: plan
        run: |
          k/ci/mutants.sh plan "$BASE" "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/plan.txt"
          count=$(sed -n 's/^count \([0-9]*\)$/\1/p' "$RUNNER_TEMP/plan.txt")
          shards=$(sed -n 's/^shards \(.*\)$/\1/p' "$RUNNER_TEMP/plan.txt")
          [ -n "$count" ] && [ -n "$shards" ] || { echo "the plan failed"; exit 1; }
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "shards=$shards" >>"$GITHUB_OUTPUT"
      - name: Save the logs to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: mkdir -p "$RUNNER_TEMP/logs" && .github/scripts/kernel_ci.sh save mutants-plan "$RUNNER_TEMP/logs"

  mutants-shard:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.149
      - name: Mutants in the changed kernel code, one shard
        id: run
        env:
          SHARDS: ${{ strategy.job-total }}
        run: |
          k/ci/mutants.sh shard ${{ matrix.shard }} "$SHARDS" "$BASE" "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/shard.txt"
          grep -qx "RESULT mutants-shard-${{ matrix.shard }} PASS [0-9]*" "$RUNNER_TEMP/shard.txt"
      - name: Save the logs to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: mkdir -p "$RUNNER_TEMP/logs" && .github/scripts/kernel_ci.sh save mutants-shard-${{ matrix.shard }} "$RUNNER_TEMP/logs"

  mutants:
    needs: [mutants-plan, mutants-shard]
    if: always() && inputs.base != ''
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Report to the kernel commit
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          PLAN: ${{ needs.mutants-plan.result }}
          SHARD: ${{ needs.mutants-shard.result }}
          COUNT: ${{ needs.mutants-plan.outputs.count }}
        run: |
          if [ "$PLAN" = success ] && { [ "$COUNT" = 0 ] || [ "$SHARD" = success ]; }; then
            .github/scripts/kernel_ci.sh status kernel-ci/mutants success "$COUNT mutants in the changed lines, all caught"
          else
            .github/scripts/kernel_ci.sh status kernel-ci/mutants failure "plan $PLAN, shards $SHARD ($COUNT mutants)"
            exit 1
          fi
