name: Kernel CI

# The private kernel's checks (SpindleLabs-app/kernel), run here because public
# repositories' runners are free and a private repo's minutes would last a
# few days (Ben's decision, 2026-10-27). The kernel repo's own ci.yml starts
# this for each pull request push and each push to its main, through
# workflow_dispatch; it never runs on anything in this repo.
#
# This log is public. So: the kernel's scripts print only RESULT lines
# (its ci/quiet.sh), every line also passes .github/scripts/kernel_ci.sh
# filter here, the full logs go only to the private kernel-results repo,
# nothing is cached (a pull request from a fork can read main's caches) and
# nothing is uploaded as an artifact (public too) except a job's files sealed
# with a per-run public key (kernel_ci.sh seal; only the keyed job opens them). The verdicts go back to the
# kernel commit as statuses kernel-ci/checks and kernel-ci/mutants, which the
# kernel repo's auto-merge waits for.
#
# Secrets, in the "kernel" environment, which only main may use (Ben adds
# them; every job that needs them names it, so no other branch's workflow
# and no fork can read them; test_kernel_ci.py checks): KERNEL_SOURCE, a
# fine-grained key with read-only contents on SpindleLabs-app/kernel, for the
# jobs that run the kernel's code; KERNEL_STATUS, commit statuses only, for
# the jobs that post the verdicts; RESULTS_WRITE, contents and issues
# read-write on SpindleLabs-app/kernel-results. (The steps still call the key
# they are handed KERNEL_READ, the name kernel_ci.sh reads; the old
# all-in-one secret of that name is no longer used, security hunt H3.)
# The title names the label, so the kernel repo's ci.yml can find and cancel
# a pull request's run when it goes back to draft.
run-name: Kernel CI ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Kernel commit to test (a pull request's merge commit, or main)"
        required: true
      head:
        description: "Kernel commit the statuses go on (the pull request's head; main: same as sha)"
        required: true
      base:
        description: "Kernel commit to count mutants from (empty: no mutation testing)"
        required: false
        default: ""
      label:
        description: "pr-<number>, train-<number> or main"
        required: true

# A newer push to the same pull request cancels the older run; main's finish.
concurrency:
  group: kernel-ci-${{ inputs.label }}
  cancel-in-progress: ${{ inputs.label != 'main' }}

# The jobs need no rights on this repo: they use the two keys above.
permissions: {}

env:
  SHA: ${{ inputs.sha }}
  HEAD_SHA: ${{ inputs.head }}
  BASE: ${{ inputs.base }}
  LABEL: ${{ inputs.label }}

jobs:
  # The kernel's checks run in parts at once, one runner each (the kernel's
  # ci/parts.sh names them): one after another they took 65 to 115 minutes
  # (2026-11-06), in parts about as long as the slowest part. A kernel commit
  # from before the parts runs them all in one part, "all".
  # The jobs below are split so that no job holds a key that writes anything
  # beside the kernel's code (security hunt H3: code a job runs on a runner can
  # change what that job's later steps run, and read the keys they hold):
  #   keys: makes a key pair for this run (the private half only in
  #     kernel-results, the public half handed on), marks the statuses pending.
  #   checks-plan, checks, mutants-plan, mutants-shard, coverage: run the
  #     kernel's code holding only KERNEL_SOURCE (read-only on the kernel,
  #     which that code can read anyway), then seal their files with the public
  #     key and upload them: an encrypted artifact, 1 day.
  #   checks-report, mutants, coverage-save: hold RESULTS_WRITE and
  #     KERNEL_STATUS, never run kernel code; take the artifacts as untrusted
  #     data (HMAC checked, then opened only into files and folders), save them
  #     to kernel-results and set the statuses.
  # A job that was itself compromised can still lie about its own run's
  # files and result; it can't reach a key or another job's files.
  keys:
    runs-on: ubuntu-24.04
    environment: kernel
    timeout-minutes: 10
    outputs:
      public: ${{ steps.keys.outputs.public }}
      folder: ${{ steps.keys.outputs.folder }}
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Mark the kernel commit pending
        env:
          KERNEL_READ: ${{ secrets.KERNEL_STATUS }}
        run: |
          .github/scripts/kernel_ci.sh status kernel-ci/checks pending "Running on SpindleLabs' runners"
          [ -z "$BASE" ] || .github/scripts/kernel_ci.sh status kernel-ci/mutants pending "Counting the mutants in the changed lines"
      - name: A key pair for this run (the private half only in kernel-results)
        id: keys
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: |
          .github/scripts/kernel_ci.sh keygen "$RUNNER_TEMP/keys"
          mkdir -p "$RUNNER_TEMP/private"
          mv "$RUNNER_TEMP/keys/private.pem" "$RUNNER_TEMP/private/"
          folder="seal/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RESULTS_PATH="$folder" .github/scripts/kernel_ci.sh save key "$RUNNER_TEMP/private"
          echo "public=$(base64 -w0 "$RUNNER_TEMP/keys/public.pem")" >> "$GITHUB_OUTPUT"
          echo "folder=$folder/key" >> "$GITHUB_OUTPUT"

  checks-plan:
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - name: The parts
        id: plan
        run: |
          if [ -x k/ci/parts.sh ]; then
            parts=$(k/ci/parts.sh list 2>/dev/null | sed -n 's/^parts \(\[[a-z,]*\]\)$/\1/p')
          else
            parts='[all]'
          fi
          [ -n "$parts" ] || { echo "the parts list failed"; exit 1; }
          echo "parts $parts"
          echo "parts=$(echo "$parts" | sed 's/\([a-z][a-z]*\)/"\1"/g')" >>"$GITHUB_OUTPUT"

  checks:
    needs: [checks-plan, keys]
    # Pinned to the image the oracles were pinned on: ubuntu-latest moved to a
    # newer one on 2026-11-11 (compiler defaulting to C23, PrusaSlicer 2.9.4
    # instead of the 2.7.2 the slicer oracle's settings are pinned to), which
    # broke the SolveSpace build and the slicer oracle on every part. Move it
    # on purpose, with the oracles re-pinned, never by drift.
    runs-on: ubuntu-24.04
    environment: kernel
    # The slowest part takes about 25 minutes; the whole checks once took 80
    # and one run on a slow runner was cancelled at 90 (2026-11-05). 150,
    # as for a mutants shard, so a kernel commit from before the parts still fits.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.checks-plan.outputs.parts) }}
    env:
      PART: ${{ matrix.part }}
    steps:
      - name: Inputs are commit ids, a label and a part, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ && $PART =~ ^[a-z]+$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/oracle-requirements.txt" >/dev/null 2>&1
      # SolveSpace, the sketch solver's outside judge: built from its pinned
      # source (30 to 50 seconds), with pinned build tools. Only the part whose
      # checks use it (solver: solver-solvespace; a kernel commit from before
      # the parts: all); a check that lacks it fails, never skips.
      - if: contains(fromJSON('["solver","all"]'), matrix.part)
        run: |
          # pip's own words go to the log when it fails (package names, files
          # and hashes of public packages only; the kernel is not in this step):
          # the step once failed on every part for days with nothing to read.
          log=$(mktemp)
          pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/solver-build-requirements.txt" >"$log" 2>&1 || { tail -n 25 "$log"; exit 1; }
          # -std=gnu17: the runners' compiler now defaults to C23, which removed
          # ATOMIC_VAR_INIT, and SolveSpace's bundled mimalloc still uses it
          # (the build failed on every part from 2026-11-11 about 01:40Z).
          CFLAGS="-std=gnu17" pip install -q --require-hashes --no-build-isolation -r "$GITHUB_WORKSPACE/.github/scripts/solver-requirements.txt" >"$log" 2>&1 || { tail -n 25 "$log"; exit 1; }
      # callgrind, for the kernel's speed baseline check; PrusaSlicer, the
      # slicing engine's oracle (Ubuntu noble ships 2.7.2).
      # Only the parts whose checks use them (baseline: release; the slicer
      # oracle: rest; a kernel commit from before the parts: all), so three
      # parts never touch the package mirror; a check that lacks its tool
      # fails, never skips. Usually 20 seconds, but a slow mirror once held it
      # 57 minutes and on 2026-11-06 failed three 5-minute tries in a row on
      # several parts at once: each download now gives up after 60 seconds
      # without data and is retried by apt itself, and a failed try waits
      # 1, 2, then 4 minutes before the next of four (up to 10 minutes each).
      - if: contains(fromJSON('["release","rest","all"]'), matrix.part)
        run: |
          # Ubuntu's mirrors stopped resolving on 2026-11-11: see the script.
          .github/scripts/apt-mirror.sh
          apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 -qq)
          for try in 1 2 3 4; do
            # A mirror that resolves can still stall: tries 2 on move to another one (see the script).
            [ $try = 1 ] || .github/scripts/apt-mirror.sh switch $try
            sudo timeout 600 apt-get "${apt[@]}" update >/dev/null 2>&1 && sudo timeout 600 apt-get "${apt[@]}" install -y valgrind prusa-slicer >/dev/null 2>&1 && exit 0
            echo "apt-get try $try failed"
            [ $try = 4 ] || sleep $((60 * 2 ** (try - 1)))
          done
          exit 1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - name: The kernel's checks (one line each; logs in kernel-results)
        id: run
        env:
          # The oracle's report is read by this repo's file_issues.py.
          SPINDLELABS_SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: |
          if [ "$PART" != all ]; then export CHECKS_PART=$PART; fi
          k/ci/checks.sh full "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/results.txt"
          grep -qx "RESULT all PASS [0-9]*" "$RUNNER_TEMP/results.txt"
      - name: Seal the logs (only the keyed job can open them)
        if: always()
        env:
          PUBLIC: ${{ needs.keys.outputs.public }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/results.txt" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          printf %s "$PUBLIC" | base64 -d > "$RUNNER_TEMP/public.pem"
          .github/scripts/kernel_ci.sh seal "$RUNNER_TEMP/logs" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/public.pem"
          name=checks; [ "$PART" = all ] || name=checks-$PART
          echo "ARTIFACT=sealed-$name" >> "$GITHUB_ENV"
      - name: Hand the sealed logs on
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/sealed
          retention-days: 1

  # kernel-ci/checks passes only when every part passed. Every part's logs are
  # saved here (opened from the sealed artifacts), and a part that failed, never
  # reported (cancelled, timed out) or whose files could not be opened is named
  # in the failure. A failing part now reports when all parts are done, not at
  # once: the job that ran the kernel's code holds no key to report with.
  checks-report:
    needs: [keys, checks-plan, checks]
    if: always()
    runs-on: ubuntu-24.04
    environment: kernel
    timeout-minutes: 15
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Take the sealed logs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sealed-checks*
          path: ${{ runner.temp }}/sealed
      - name: Open them, save them to kernel-results, report to the kernel commit
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          KERNEL_READ: ${{ secrets.KERNEL_STATUS }}
          KEYS: ${{ needs.keys.result }}
          KEY_FOLDER: ${{ needs.keys.outputs.folder }}
          PLAN: ${{ needs.checks-plan.result }}
          PARTS: ${{ needs.checks.result }}
          PART_LIST: ${{ needs.checks-plan.outputs.parts }}
        run: |
          ci=.github/scripts/kernel_ci.sh
          out="$RUNNER_TEMP/opened"
          if [ "$KEYS" = success ] && [ -d "$RUNNER_TEMP/sealed" ]; then
            $ci fetch "$KEY_FOLDER" "$RUNNER_TEMP/private" || true
            $ci save-sealed "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/private/private.pem" "$out" || true
          fi
          failed=""
          if [ "$KEYS" = success ] && [ "$PLAN" = success ]; then
            for p in $(python3 -c 'import json,sys; print(" ".join(json.loads(sys.argv[1])))' "$PART_LIST"); do
              name=checks; [ "$p" = all ] || name=checks-$p
              if grep -qx "RESULT all PASS [0-9]*" "$out/$name/results.txt" 2>/dev/null; then continue; fi
              failed="$p: $($ci describe "$out/$name/results.txt" "no result from this part")"
              break
            done
          fi
          if [ "$KEYS" = success ] && [ "$PLAN" = success ] && [ "$PARTS" = success ] && [ -z "$failed" ]; then
            $ci status kernel-ci/checks success "Every part passed"
          else
            [ -n "$failed" ] || failed="keys $KEYS, plan $PLAN, parts $PARTS"
            $ci status kernel-ci/checks failure "$failed"
            exit 1
          fi

  # Which kernel code no test runs at all (the kernel's ci/coverage.sh): a
  # per-file table and an lcov file, in kernel-results only. Report only: no
  # status, so it never holds a merge. Only for main's runs, after each merge
  # (Ben, 2026-10-29: about 790 runner minutes a day went on every pull
  # request push's copy).
  #
  #
  # Split like the other jobs here (see keys above): coverage runs the kernel's code
  # with only KERNEL_SOURCE, coverage-save holds RESULTS_WRITE.
  coverage:
    needs: keys
    if: inputs.label == 'main'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Kernel test coverage (report in kernel-results)
        run: |
          [ -x k/ci/coverage.sh ] || { echo "this kernel commit has no ci/coverage.sh yet"; exit 0; }
          .github/scripts/kernel_ci.sh run coverage "$RUNNER_TEMP/logs" k/ci/coverage.sh "$RUNNER_TEMP/logs"
      - name: Seal the report (only the keyed job can open it)
        if: always()
        env:
          PUBLIC: ${{ needs.keys.outputs.public }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          printf %s "$PUBLIC" | base64 -d > "$RUNNER_TEMP/public.pem"
          .github/scripts/kernel_ci.sh seal "$RUNNER_TEMP/logs" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/public.pem"
      - name: Hand the sealed report on
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-coverage
          path: ${{ runner.temp }}/sealed
          retention-days: 1
  coverage-save:
    needs: [keys, coverage]
    if: always() && inputs.label == 'main' && needs.keys.result == 'success'
    runs-on: ubuntu-24.04
    environment: kernel
    timeout-minutes: 15
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Take the sealed report
        id: sealed
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sealed-coverage
          path: ${{ runner.temp }}/sealed
      - name: Open it and save it to kernel-results
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          KEY_FOLDER: ${{ needs.keys.outputs.folder }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ "${{ steps.sealed.outcome }}" = success ]; then
            .github/scripts/kernel_ci.sh fetch "$KEY_FOLDER" "$RUNNER_TEMP/private"
            .github/scripts/kernel_ci.sh unseal "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/private/private.pem"
          else
            echo "the coverage job handed on no files (its result: $COVERAGE)" > "$RUNNER_TEMP/logs/not-run.txt"
          fi
          .github/scripts/kernel_ci.sh save coverage "$RUNNER_TEMP/logs"

  mutants-plan:
    needs: keys
    if: inputs.base != ''
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Count the mutants in the changed kernel code
        id: plan
        run: |
          k/ci/mutants.sh plan "$BASE" "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/plan.txt"
          count=$(sed -n 's/^count \([0-9]*\)$/\1/p' "$RUNNER_TEMP/plan.txt")
          shards=$(sed -n 's/^shards \(.*\)$/\1/p' "$RUNNER_TEMP/plan.txt")
          [ -n "$count" ] && [ -n "$shards" ] || { echo "the plan failed"; exit 1; }
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "shards=$shards" >>"$GITHUB_OUTPUT"
          # The crates with changed lines (kernel, slice, fea; a kernel commit
          # from before the slicer and solver were mutated prints no such line).
          echo "crates=$(sed -n 's/^crates \(.*\)$/\1/p' "$RUNNER_TEMP/plan.txt")" >>"$GITHUB_OUTPUT"
      - name: Seal the logs (only the keyed job can open them)
        if: always()
        env:
          PUBLIC: ${{ needs.keys.outputs.public }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          printf %s "$PUBLIC" | base64 -d > "$RUNNER_TEMP/public.pem"
          .github/scripts/kernel_ci.sh seal "$RUNNER_TEMP/logs" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/public.pem"
      - name: Hand the sealed logs on
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-mutants-plan
          path: ${{ runner.temp }}/sealed
          retention-days: 1

  mutants-shard:
    needs: [keys, mutants-plan]
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          REF: ${{ inputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF" "$BASE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.149
      - name: Mutants in the changed kernel code, one shard
        id: run
        env:
          SHARDS: ${{ strategy.job-total }}
        run: |
          k/ci/mutants.sh shard ${{ matrix.shard }} "$SHARDS" "$BASE" "$RUNNER_TEMP/logs" 2>/dev/null | .github/scripts/kernel_ci.sh filter | tee "$RUNNER_TEMP/shard.txt"
          grep -qx "RESULT mutants-shard-${{ matrix.shard }} PASS [0-9]*" "$RUNNER_TEMP/shard.txt"
      - name: Seal the logs (only the keyed job can open them)
        if: always()
        env:
          PUBLIC: ${{ needs.keys.outputs.public }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/shard.txt" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          printf %s "$PUBLIC" | base64 -d > "$RUNNER_TEMP/public.pem"
          .github/scripts/kernel_ci.sh seal "$RUNNER_TEMP/logs" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/public.pem"
      - name: Hand the sealed logs on
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/sealed
          retention-days: 1

  mutants:
    needs: [keys, mutants-plan, mutants-shard]
    if: always() && inputs.base != ''
    runs-on: ubuntu-24.04
    environment: kernel
    timeout-minutes: 15
    steps:
      - name: Inputs are commit ids and a label, nothing else
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ && $HEAD_SHA =~ ^[0-9a-f]{40}$ && ( -z $BASE || $BASE =~ ^[0-9a-f]{40}$ ) && $LABEL =~ ^(pr-[0-9]+|train-[0-9]+|main)$ ]] || { echo "bad inputs"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Take the sealed logs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sealed-mutants*
          path: ${{ runner.temp }}/sealed
      - name: Open them, save them to kernel-results, report to the kernel commit
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          KERNEL_READ: ${{ secrets.KERNEL_STATUS }}
          KEYS: ${{ needs.keys.result }}
          KEY_FOLDER: ${{ needs.keys.outputs.folder }}
          PLAN: ${{ needs.mutants-plan.result }}
          SHARD: ${{ needs.mutants-shard.result }}
          COUNT: ${{ needs.mutants-plan.outputs.count }}
          CRATES: ${{ needs.mutants-plan.outputs.crates }}
        run: |
          ci=.github/scripts/kernel_ci.sh
          if [ "$KEYS" = success ] && [ -d "$RUNNER_TEMP/sealed" ]; then
            $ci fetch "$KEY_FOLDER" "$RUNNER_TEMP/private" || true
            $ci save-sealed "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/private/private.pem" "$RUNNER_TEMP/opened" || true
          fi
          if [ "$KEYS" = success ] && [ "$PLAN" = success ] && { [ "$COUNT" = 0 ] || [ "$SHARD" = success ]; }; then
            # Say what was mutated, so "0" never reads as "tested" (test audit E-3).
            case $CRATES in
              "") what="$COUNT mutants in the changed lines, all caught" ;;
              none) what="$COUNT mutants and plants: no changed lines in the kernel, slicer or solver" ;;
              *) what="$COUNT mutants and plants in the changed lines (${CRATES//,/, }), all caught" ;;
            esac
            $ci status kernel-ci/mutants success "$what"
          else
            $ci status kernel-ci/mutants failure "keys $KEYS, plan $PLAN, shards $SHARD ($COUNT mutants)"
            exit 1
          fi
