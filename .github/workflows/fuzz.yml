name: Fuzzing

# Fuzzing on GitHub's computers (free for public repos): the project loader
# (packages/testing/src/project-fuzz.ts), broken files by the thousand
# checked against a simple model, a fresh seed every round of 2,000 inputs.
# Alongside it, simulated users sketching and extruding on the real kernel
# (packages/testing/fuzz/sketch-extrude.ts, rounds of 50 sessions × 40
# steps against the sessions' own model), then up to 20,000 of the extrudes
# they built compared with exact values and OpenCascade (the private kernel
# repo's oracle; a disagreement is a failure folder with
# oracle-disagreements.txt, the shapes and the checks' names only, the full
# text in kernel-results), which also has OpenCascade read
# every body from its STEP file as the kernel wrote it (step 29b3), and then
# plants a flipped face in every file of a short run (FISSION_STEP_FAULT),
# which must be caught in every body (`--planted`). Design's timeline on the
# real kernel in long sessions (packages/testing/fuzz/timeline.ts, step 25b3:
# rounds of 5 sessions × 500 steps against the timeline model, failures
# shrunk to the fewest steps; each round's simulated-user numbers, Tier 3
# item 4, go to numbers.jsonl and the summary, step 30d). Stacked face
# sketches (packages/testing/fuzz/face-stack.ts: rounds of 25 seeded chains,
# each 5 to 8 prisms sketched on random faces of the ones before and
# extruded, then edited, every step checked against an exact model, saved
# and reopened, undone and redone; failures shrunk to the fewest prisms and
# edits), with a self-test that a bug planted in it is caught. The kernel's
# own fuzzing (the STL reader, the coverage-guided targets) moved with the
# kernel to its private repo and runs in kernel-fuzz.yml (2026-10-27).
#
# Nightly at 23:10 UTC (7:10am Perth), after the random testing run
# (nightly.yml) so the two never push to test-results at once; 45 minutes a
# job, so results are in by about 8am Perth. "Run workflow" on the Actions
# tab tests any branch for `minutes`.
#
# A final job adds the rounds to the test-results branch
# (.github/scripts/collect-fuzz.sh: fuzz/log.csv, fuzz/summary.txt, and
# fuzz/failures/seed-<seed>/ with fuzz-report.txt and the shrunk inputs) and
# files one issue per kind of problem, as random testing does
# (.github/scripts/file_issues.py). Scheduled runs only fire from the default
# branch.
on:
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of fuzzing per reader"
        default: "45"

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  # Starts the testing only once CI is idle (Ben, 2026-10-29): no CI job
  # waiting for a runner and no merge queue run (branch_testing.py
  # wait-idle), or after three hours however busy, so a night is never lost.
  # It holds one runner while it waits instead of all of them.
  idle:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/branch_testing.py wait-idle 10800

  project:
    needs: idle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fuzz the project loader until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run fuzz -w @fission/testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-project
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  sessions:
    needs: idle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Sketch and extrude sessions until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run sessions -w @fission/testing
      # The STEP check's self-test input: a minute of sessions with a face
      # flipped in every file, each of which the oracle must report.
      - name: A minute of sessions with a planted flipped face
        if: always()
        env:
          PLANTED: ${{ runner.temp }}/planted
        run: FISSION_STEP_FAULT=1 FISSION_FUZZ_SECONDS=60 FISSION_FUZZ_OUT="$PLANTED" npm run sessions -w @fission/testing
      # The sessions' shapes for the oracle job (kept a day).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: oracle-input-sessions
          path: |
            ${{ runner.temp }}/fuzz/oracle.jsonl
            ${{ runner.temp }}/planted/oracle.jsonl
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-sessions
          path: |
            ${{ runner.temp }}/fuzz/log.csv
            ${{ runner.temp }}/fuzz/seed-*/
          if-no-files-found: ignore

  timeline:
    needs: idle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Long timeline sessions until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run timeline-fuzz -w @fission/testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-timeline
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  stack:
    needs: idle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # A third of the readers' time: a chain takes about 0.3 s, so 15 minutes is about 3,000 chains and 55,000 checked steps.
      - name: Stacked face sketches until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 20 )) npm run stack -w @fission/testing
      # Its self-test: a few seconds with the model's prisms a tenth of a nanometre long, which every chain must fail.
      - name: A bug planted in the stacked chains is caught
        if: always()
        env:
          PLANTED: ${{ runner.temp }}/planted
        # Every chain the planted run tried must catch it: as many failure folders as chains in its log (rounds of 25;
        # a fast runner fits several rounds into the second, 125 of 125 on 10-29, which "exactly 25" called a failure,
        # issue #63). A miss is written as a failure folder, so the night's issue names it.
        run: |
          missed() {
            echo "$1"
            mkdir -p "$RUNNER_TEMP/fuzz/seed-stack-planted"
            printf 'Stacked face sketches, planted bug model-long: 1 kind(s) of failure\nfailure: the planted bug check: %s | %s\n' "$2" "$1" >"$RUNNER_TEMP/fuzz/seed-stack-planted/fuzz-report.txt"
            exit 1
          }
          if FISSION_STACK_FAULT=model-long FISSION_FUZZ_SECONDS=1 FISSION_FUZZ_OUT="$PLANTED" npm run stack -w @fission/testing >"$RUNNER_TEMP/planted.txt"; then
            missed "the planted bug was not caught" "not caught"
          fi
          caught=$(ls -d "$PLANTED"/seed-stack-* | wc -l)
          chains=$(awk -F, 'NR > 1 { n += $3 } END { print n + 0 }' "$PLANTED/log.csv")
          echo "planted bug caught in $caught of $chains chains"
          [ "$chains" -ge 25 ] && [ "$caught" -eq "$chains" ] || missed "planted bug caught in $caught of $chains chains" "caught in only some chains"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-stack
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  # This run's key pair for the oracle's full findings (H3c): holds
  # RESULTS_WRITE and runs no kernel code, like kernel-fuzz.yml's plan; the
  # private half goes only to kernel-results (seal/<run>-<attempt>/key).
  oracle-key:
    needs: idle
    if: github.ref == 'refs/heads/main'
    environment: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.keys.outputs.public }}
      key_folder: ${{ steps.keys.outputs.folder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: A key pair for this run (the private half only in kernel-results)
        id: keys
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: |
          .github/scripts/kernel_ci.sh keygen "$RUNNER_TEMP/keys"
          mkdir -p "$RUNNER_TEMP/private"
          mv "$RUNNER_TEMP/keys/private.pem" "$RUNNER_TEMP/private/"
          folder="seal/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RESULTS_PATH="$folder" .github/scripts/kernel_ci.sh save key "$RUNNER_TEMP/private"
          echo "public=$(base64 -w0 "$RUNNER_TEMP/keys/public.pem")" >> "$GITHUB_OUTPUT"
          echo "folder=$folder/key" >> "$GITHUB_OUTPUT"

  # The sessions' extrudes compared with exact values and OpenCascade by the
  # private kernel's oracle. Main only, in the "kernel" environment (main
  # only too), so no branch's workflow can read the key that clones the
  # kernel; no npm code runs beside it. Its findings go into a fuzz-*
  # artifact, which collect reads like the others, reduced to the shapes and
  # the checks' names (oracle_public.py: the details say how the kernel
  # judges a body, which never goes public); the full text is sealed for
  # oracle-save, which puts it in kernel-results.
  sessions-oracle:
    needs: [sessions, oracle-key]
    if: always() && needs.sessions.result != 'skipped' && needs.oracle-key.result == 'success' && github.ref == 'refs/heads/main'
    environment: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oracle-input-sessions
          path: ${{ runner.temp }}/in
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out the kernel's oracle (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_SOURCE }}
          SPARSE: prototypes/oracle
        run: .github/scripts/kernel_ci.sh checkout k main
      - name: Compare the extrudes with exact values and OpenCascade
        env:
          IN: ${{ runner.temp }}/in
          OUT: ${{ runner.temp }}/fuzz
        working-directory: k/prototypes/oracle
        run: |
          mkdir -p "$OUT"
          [ -f "$IN/fuzz/oracle.jsonl" ] || exit 0
          pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/oracle-requirements.txt"
          # The oracle is private kernel code: its errors (a traceback names its
          # files and lines) and its disagreements (they name its checks) go to
          # files of the runner's, never this public log; only the count is shown.
          # The full findings go to the sealed folder only; the public one gets oracle_public.py's reduction.
          code=0
          private="$RUNNER_TEMP/private-out"
          mkdir -p "$private"
          python3 sketch_extrude.py "$IN/fuzz/oracle.jsonl" "$private/oracle-disagreements.txt" >"$private/oracle.txt" 2>"$private/oracle-errors.txt" || code=$?
          head -1 "$private/oracle.txt"
          if [ "$code" -ne 0 ]; then
            mkdir -p "$OUT/seed-oracle-${{ github.run_id }}"
            python3 "$GITHUB_WORKSPACE/.github/scripts/oracle_public.py" sessions "$private/oracle-disagreements.txt" "$OUT/seed-oracle-${{ github.run_id }}/oracle-disagreements.txt"
            exit 1
          fi
      - name: The oracle catches a planted flipped face in every session's STEP file
        if: always()
        env:
          IN: ${{ runner.temp }}/in
        working-directory: k/prototypes/oracle
        run: |
          code=0
          private="$RUNNER_TEMP/private-out"
          mkdir -p "$private"
          python3 sketch_extrude.py "$IN/planted/oracle.jsonl" "$private/planted-disagreements.txt" --planted >"$private/oracle-planted.txt" 2>>"$private/oracle-errors.txt" || code=$?
          head -1 "$private/oracle-planted.txt"
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-sessions-oracle
          path: ${{ runner.temp }}/fuzz/seed-*/
          if-no-files-found: ignore
      - name: Seal the full findings (only oracle-save can open them)
        if: always()
        env:
          PUBLIC: ${{ needs.oracle-key.outputs.public }}
        run: |
          mkdir -p "$RUNNER_TEMP/private-out"
          printf %s "$PUBLIC" | base64 -d > "$RUNNER_TEMP/public.pem"
          .github/scripts/kernel_ci.sh seal "$RUNNER_TEMP/private-out" "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/public.pem"
      - name: Hand the sealed findings on
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-sessions-oracle
          path: ${{ runner.temp }}/sealed
          retention-days: 1

  # Opens the oracle's sealed findings (untrusted data: HMAC checked, files
  # and folders only) and saves them to kernel-results'
  # runs/<run>-<attempt>/sessions-oracle/. Holds RESULTS_WRITE and runs no
  # kernel code.
  oracle-save:
    needs: [oracle-key, sessions-oracle]
    if: always() && needs.oracle-key.result == 'success' && needs.sessions-oracle.result != 'skipped'
    environment: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Take the sealed findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sealed-*
          path: ${{ runner.temp }}/sealed
      - name: Open them and save them to kernel-results
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          KEY_FOLDER: ${{ needs.oracle-key.outputs.key_folder }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ci=.github/scripts/kernel_ci.sh
          out="$RUNNER_TEMP/opened"
          mkdir -p "$out" "$RUNNER_TEMP/sealed"
          code=0
          $ci fetch "$KEY_FOLDER" "$RUNNER_TEMP/private" || exit 1
          $ci open-sealed "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/private/private.pem" "$out" || code=1
          rm -rf "$RUNNER_TEMP/private"
          if [ -n "$(ls -A "$out")" ]; then RESULTS_PATH=runs $ci save "$RUN" "$out" || code=1; else echo "no findings to save"; fi
          exit $code

  collect:
    needs: [project, sessions, oracle-key, sessions-oracle, oracle-save, timeline, stack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Only the public folders: the sealed findings are kernel-results' alone.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-*
          path: ${{ runner.temp }}/incoming
      - name: Add this run to the test-results branch and file issues
        env:
          IN: ${{ runner.temp }}/incoming
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          # The tested code's repository: a closed issue seen again on code older than its closing is not reopened (file_issues.py).
          CODE_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          # Each job's result: a red one with no failure folder (a fuzzer that
          # crashed or ran out of time) files an issue too.
          JOBS: ${{ toJSON(needs) }}
        # Copied out first: the script switches this checkout to test-results.
        run: |
          cp .github/scripts/collect-fuzz.sh .github/scripts/file_issues.py .github/scripts/sim_numbers.py "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/collect-fuzz.sh"
