name: Kernel random testing

# The private kernel's Tier 3 (SpindleLabs-app/kernel), on this public repo's free
# runners like its CI (kernel-ci.yml; Ben's decision, 2026-10-27).
#
# Nightly, 11pm to 6:35am Perth (UTC+8), so 15:00 to 22:35 UTC, testing the
# kernel's main (started by kernel-night-clock.yml with `night`, since GitHub
# drops or delays most of this repo's scheduled runs): 8 parallel jobs run
# the kernel's scripts/endless.sh (the stateful harness plus the OpenCascade oracle, a fresh random seed per round)
# in two legs, because a GitHub job may last at most 6 hours; alongside the
# first leg, 4 jobs run the next slice of the whole-kernel mutation rotation
# (mutant_rotation.py: cargo mutants, lib tests, the kernel's riskiest code
# first; the whole kernel no longer fits in one night, so each night carries
# on where the last stopped and a new cycle starts when every mutant has been
# tested). Every job is cut off at 22:35 UTC however late it started.
#
# "Run workflow" (a kernel thread starts it after each push: workflow_dispatch
# on this repo's main with `ref` = the kernel branch) tests one kernel branch:
# 4 jobs for `minutes`; the mutation rotation only if asked, and only on main. Branch runs share one
# queue and give way like this repo's own did (stop-on-merge.sh with
# KERNEL_REPO, branch_testing.py with TESTING_WORKFLOW): the rounds stop after
# the round in progress once the kernel branch has merged into main, a CI job
# (this repo's or the kernel's) has waited two minutes for a runner, a newer
# run of the same branch waits, or another branch's run has waited an hour;
# the kernel repo cancels a branch's runs when its pull request closes. The
# run's title names the branch, which is how those scripts find it.
#
# This log is public: every kernel command runs through kernel_ci.sh run (one
# RESULT line, the output in a log), nothing is cached and nothing is
# uploaded as an artifact. Each job pushes its results and logs to the
# private kernel-results repo (runs/<run>-<attempt>/<job>/), and the collect
# job adds them to kernel-results' test-results branch with this repo's
# collect-results.sh (log.csv, summary.txt, failures/<seed>/, mutants/) and
# files one issue per kind of problem there (file_issues.py).
#
# Secrets: KERNEL_READ (kernel: contents read-only, statuses read-write) and
# RESULTS_WRITE (kernel-results: contents and issues read-write), as for
# kernel-ci.yml; only this repo's own branches' workflows see them.
run-name: ${{ inputs.night && 'Kernel random testing, nightly' || format('Kernel random testing on {0}', inputs.ref) }}

on:
  # No schedule: GitHub started this repo's scheduled runs hours late or not
  # at all (11-06 and 11-07: 4 to 5.5 h late; 11-08: none of twelve hourly
  # runs). kernel-night-clock.yml starts the night instead.
  workflow_dispatch:
    inputs:
      night:
        description: "Tonight's testing of main (kernel-night-clock.yml starts it; the rest of the inputs are ignored)"
        type: boolean
        default: false
      ref:
        description: "Kernel branch to test"
        default: "main"
      minutes:
        description: "Minutes of random testing per job"
        default: "290"
      mutants:
        description: "Also run the next slice of the whole-kernel mutation rotation (main only)"
        type: boolean
        default: false

permissions: {}

# The night, the kernel's main by hand, and every kernel branch's runs in one
# shared group, as nightly.yml had (Ben, 2026-10-26). Tested in
# .github/scripts/test_ci_concurrency.py.
concurrency:
  group: kernel-random-testing-${{ inputs.night && 'nightly' || inputs.ref == 'main' && 'main' || 'branches' }}
  cancel-in-progress: false

env:
  REF: ${{ inputs.night && 'main' || inputs.ref }}
  NIGHT: ${{ inputs.night && 'true' || 'false' }}

jobs:
  # Starts the testing only once CI is idle (Ben, 2026-10-29): no CI job
  # waiting for a runner and no merge queue run (branch_testing.py
  # wait-idle), or after an hour (tonight's run; a branch's: two) however busy, so a night is never lost.
  # It holds one runner while it waits instead of all of them.
  idle:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # A night run takes the night only inside 15:00-22:05 UTC and only
      # if no earlier run took it today (nightly_gate.py); a branch's, always.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly_gate.py gate kernel-nightly.yml
      - if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/branch_testing.py wait-idle ${{ inputs.night && 3600 || 7200 }}

  plan:
    needs: idle
    if: needs.idle.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      deadline: ${{ steps.plan.outputs.deadline }}
      mutants_deadline: ${{ steps.plan.outputs.mutants_deadline }}
      jobs: ${{ steps.plan.outputs.jobs }}
      second_leg: ${{ steps.plan.outputs.second_leg }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          NIGHTLY: ${{ env.NIGHT }}
          MINUTES: ${{ inputs.minutes || '290' }}
          MUTANTS: ${{ inputs.mutants }}
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          [[ $REF =~ ^[A-Za-z0-9._][A-Za-z0-9._/-]*$ ]] || { echo "bad branch name"; exit 1; }
          # Every job tests this one commit, even if the branch moves meanwhile.
          sha=$(git ls-remote "https://x-access-token:$KERNEL_READ@github.com/SpindleLabs-app/kernel.git" "refs/heads/$REF" 2>/dev/null | cut -f1)
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "no kernel branch $REF"; exit 1; }
          now=$(date +%s)
          if [ "$NIGHTLY" = true ]; then
            # 22:35 UTC of the day the run started (idle's gate only lets a
            # run through from 15:00 UTC, so this is the same UTC day). A night
            # run can wait for runners: one that starts after 22:05 UTC (or
            # after midnight, when "today's" 22:35 would be a whole day of
            # runners away) skips the night instead.
            deadline=$(date -u -d "$(date -u +%F) 22:35" +%s)
            hour=$(date -u +%-H)
            if [ "$hour" -lt 14 ] || [ $(( deadline - now )) -lt 1800 ]; then
              echo "Tonight's run started too late ($(date -u '+%H:%M UTC')); skipped"; exit 1
            fi
            jobs="[0,1,2,3,4,5,6,7]" shards=4
          else
            deadline=$(( now + MINUTES * 60 ))
            jobs="[0,1,2,3]" shards=0
            # The rotation's state is main's: a branch's mutants are the
            # kernel pull request check's (its changed lines).
            if [ "$MUTANTS" = true ]; then
              if [ "$REF" = main ]; then shards=4; else echo "The mutation rotation runs on main only; skipped"; fi
            fi
          fi
          # A leg lasts at most 315 minutes of testing (job limit 350); a second
          # leg runs when the first can't reach the deadline.
          second_leg=false
          [ $(( deadline - now )) -gt $(( 330 * 60 )) ] && second_leg=true
          # Mutation shards: at most 330 minutes, and never past the night's deadline.
          mutants_deadline=$(( now + 330 * 60 ))
          [ "$NIGHTLY" = true ] && [ $deadline -lt $mutants_deadline ] && mutants_deadline=$deadline
          echo "Testing kernel $REF at $sha until $(date -u -d "@$deadline" '+%F %H:%M UTC'); second leg: $second_leg; mutation shards: $shards"
          {
            echo "sha=$sha"
            echo "deadline=$deadline"
            echo "mutants_deadline=$mutants_deadline"
            echo "jobs=$jobs"
            echo "second_leg=$second_leg"
            echo "shards=$(if [ $shards -gt 0 ]; then seq -s, 0 $((shards - 1)) | sed 's/.*/[&]/'; else echo '[]'; fi)"
          } >>"$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 350
    permissions:
      # actions: read lets stop-on-merge.sh see waiting runs and CI jobs.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ needs.plan.outputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/oracle-requirements.txt" >/dev/null 2>&1
      - name: Random rounds until the time is up (logs in kernel-results)
        env:
          DEADLINE: ${{ needs.plan.outputs.deadline }}
          FISSION_ENDLESS_STOP_FILE: ${{ runner.temp }}/stop-random-testing
          GH_TOKEN: ${{ github.token }}
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          KERNEL_REPO: SpindleLabs-app/kernel
          TESTING_WORKFLOW: kernel-nightly.yml
        run: |
          watcher=
          # A branch's run, and tonight's jobs past the first two (the night
          # always keeps two), give their runners to CI (stop-on-merge.sh).
          if { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REF" != main ]; } || { [ "$NIGHT" = true ] && [ "${{ matrix.job }}" -ge 2 ]; }; then
            .github/scripts/stop-on-merge.sh "$REF" "$FISSION_ENDLESS_STOP_FILE" >"$RUNNER_TEMP/watcher.log" 2>&1 &
            watcher=$!
          fi
          code=0
          .github/scripts/kernel_ci.sh run rounds "$RUNNER_TEMP/out" k/kernel/scripts/run-until.sh "$DEADLINE" || code=$?
          [ -z "$watcher" ] || kill "$watcher" 2>/dev/null || true
          cp "$RUNNER_TEMP/watcher.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          exit $code
      - name: Save the results to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
          # This leg's own result (the job's is one for every leg): file_issues.py
          # counts a leg that passed as clean beside one that failed.
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "$JOB_STATUS" >"$RUNNER_TEMP/out/job-status.txt"
          cp -R k/kernel/endless-results/. "$RUNNER_TEMP/out/" 2>/dev/null || true
          .github/scripts/kernel_ci.sh save endless-a-${{ matrix.job }} "$RUNNER_TEMP/out"

  test-second-leg:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.second_leg == 'true' }}
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 350
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ needs.plan.outputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r "$GITHUB_WORKSPACE/.github/scripts/oracle-requirements.txt" >/dev/null 2>&1
      - name: Random rounds until the time is up (logs in kernel-results)
        env:
          DEADLINE: ${{ needs.plan.outputs.deadline }}
          FISSION_ENDLESS_STOP_FILE: ${{ runner.temp }}/stop-random-testing
          GH_TOKEN: ${{ github.token }}
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          KERNEL_REPO: SpindleLabs-app/kernel
          TESTING_WORKFLOW: kernel-nightly.yml
        run: |
          watcher=
          # A branch's run, and tonight's jobs past the first two (the night
          # always keeps two), give their runners to CI (stop-on-merge.sh).
          if { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REF" != main ]; } || { [ "$NIGHT" = true ] && [ "${{ matrix.job }}" -ge 2 ]; }; then
            .github/scripts/stop-on-merge.sh "$REF" "$FISSION_ENDLESS_STOP_FILE" >"$RUNNER_TEMP/watcher.log" 2>&1 &
            watcher=$!
          fi
          code=0
          .github/scripts/kernel_ci.sh run rounds "$RUNNER_TEMP/out" k/kernel/scripts/run-until.sh "$DEADLINE" || code=$?
          [ -z "$watcher" ] || kill "$watcher" 2>/dev/null || true
          cp "$RUNNER_TEMP/watcher.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          exit $code
      - name: Save the results to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
          # This leg's own result (the job's is one for every leg): file_issues.py
          # counts a leg that passed as clean beside one that failed.
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "$JOB_STATUS" >"$RUNNER_TEMP/out/job-status.txt"
          cp -R k/kernel/endless-results/. "$RUNNER_TEMP/out/" 2>/dev/null || true
          .github/scripts/kernel_ci.sh save endless-b-${{ matrix.job }} "$RUNNER_TEMP/out"

  mutants:
    needs: plan
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check out the kernel (quietly, the log is public)
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          REF: ${{ needs.plan.outputs.sha }}
        run: .github/scripts/kernel_ci.sh checkout k "$REF"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Fetch the rotation's state from kernel-results (quietly)
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
        run: |
          # mutants/rotation.json on test-results: which units this cycle
          # still has to test (none yet: the first cycle starts). A failed
          # fetch stops the job: without the state it would redo cycle 1.
          git clone -q --depth 1 --branch test-results --filter=blob:none --sparse \
            "https://x-access-token:$RESULTS_WRITE@github.com/SpindleLabs-app/kernel-results.git" "$RUNNER_TEMP/r" >/dev/null 2>&1 &&
            git -C "$RUNNER_TEMP/r" sparse-checkout set mutants >/dev/null 2>&1 || { echo "could not fetch the rotation's state"; exit 1; }
          if [ -f "$RUNNER_TEMP/r/mutants/rotation.json" ]; then echo "state found"; else echo "no state yet"; fi
      - name: Mutation testing, this job's share of the rotation's next units (logs in kernel-results)
        env:
          DEADLINE: ${{ needs.plan.outputs.mutants_deadline }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          # Opt-level 1: the lib tests run five times faster than at 0, same
          # verdicts (the kernel's CLAUDE.md, Mutation testing).
          CARGO_PROFILE_DEV_OPT_LEVEL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          code=0
          # Its output names kernel files: all of it goes to the log in kernel-results.
          .github/scripts/kernel_ci.sh run mutants-shard-$SHARD "$out" bash -c \
            "cd k/kernel && python3 '$GITHUB_WORKSPACE/.github/scripts/mutant_rotation.py' run --job $SHARD --jobs $SHARDS --deadline $DEADLINE --state '$RUNNER_TEMP/r/mutants/rotation.json' --out '$out' --scratch '$RUNNER_TEMP/scratch'" || code=$?
          echo $code >"$out/exit-code.txt"
          # Counts only (no mutant names): units done, and the mutants caught and missed in them.
          done=0 caught=0 missed=0
          for u in "$out"/units/*/; do
            [ -d "$u" ] || continue
            case "$(cat "$u/exit-code.txt" 2>/dev/null)" in 0 | 2 | 3) done=$((done + 1)) ;; esac
            caught=$((caught + $(cat "$u/caught.txt" 2>/dev/null | grep -c . || true)))
            missed=$((missed + $(cat "$u/missed.txt" 2>/dev/null | grep -c . || true)))
          done
          echo "exit code $code; units done $done; caught $caught, missed $missed"
          # 4: the unmutated tests failed; anything else but 0: the rotation
          # itself failed. Both make the job red, and collect files an issue.
          exit $code
      - name: Save the results to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "$JOB_STATUS" >"$RUNNER_TEMP/out/job-status.txt"
          .github/scripts/kernel_ci.sh save mutants-${{ matrix.shard }} "$RUNNER_TEMP/out"

  collect:
    needs: [plan, test, test-second-leg, mutants]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Add this run to kernel-results' test-results branch and file issues there
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          GH_TOKEN: ${{ secrets.RESULTS_WRITE }}
          GH_REPO: SpindleLabs-app/kernel-results
          MUTANT_SHARDS: ${{ needs.plan.outputs.shards == '[]' && '0' || '4' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ needs.plan.outputs.sha }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          # Each job's result: a red one with no failure folder files an issue too.
          JOBS: ${{ toJSON(needs) }}
        run: |
          export BRANCH=$REF
          r="$RUNNER_TEMP/results"
          git clone -q "https://x-access-token:$RESULTS_WRITE@github.com/SpindleLabs-app/kernel-results.git" "$r" 2>/dev/null
          # Copied out first: collect-results.sh switches the clone to test-results.
          export IN="$RUNNER_TEMP/incoming"
          cp -R "$r/runs/$RUN" "$IN" 2>/dev/null || mkdir -p "$IN"
          cp .github/scripts/collect-results.sh .github/scripts/mutant_rotation.py .github/scripts/file_issues.py .github/scripts/dump_pictures.sh .github/scripts/coverage_issue.py "$RUNNER_TEMP/"
          # The summary and issue text name kernel tests: only into the private repo, never this log.
          cd "$r" && GITHUB_STEP_SUMMARY='' "$GITHUB_WORKSPACE/.github/scripts/kernel_ci.sh" run collect "$RUNNER_TEMP/logs" bash "$RUNNER_TEMP/collect-results.sh"
      - name: Save the collect log to kernel-results
        if: always()
        env:
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          RESULTS_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}
        run: mkdir -p "$RUNNER_TEMP/logs" && .github/scripts/kernel_ci.sh save collect "$RUNNER_TEMP/logs"

  # The engine's keys end a year after they were made: from three weeks
  # before, one issue here names the key and the date (token_expiry.py; it
  # prints nothing else). Nightly runs only.
  keys:
    needs: idle
    if: inputs.night && needs.idle.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment: kernel
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: The engine's keys have more than three weeks left
        env:
          KERNEL_READ: ${{ secrets.KERNEL_READ }}
          RESULTS_WRITE: ${{ secrets.RESULTS_WRITE }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/token_expiry.py KERNEL_READ RESULTS_WRITE
