<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- The same policy serve.mjs sends as a header, for hosts that can't send one (GitHub Pages); SERVICE_ORIGIN is
       filled in by serve.mjs and build.mjs. frame-ancestors can't be set here, so review.js refuses to run framed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'self' SERVICE_ORIGIN; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>SpindleLabs review</title>
  <link rel="stylesheet" href="review.css">
  <script type="module" src="review.js"></script>
</head>
<body>
  <header>
    <h1>SpindleLabs review</h1>
    <span id="who"></span>
    <nav id="tabs" hidden>
      <button data-tab="queue">Reports</button>
      <button data-tab="claims">Copyright claims</button>
      <button data-tab="log">Record</button>
      <button id="sign-out">Sign out</button>
    </nav>
  </header>
  <p id="status" role="status"></p>
  <main id="main"></main>
</body>
</html>
